name: Update game data
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data.json teams.json)" ]; then
            git config user.name "game-finder-bot"
            git config user.email "game-finder-bot@users.noreply.github.com"
            git add data.json teams.json
            git commit -m "Hourly data update"
            git pull --rebase -q
            git push
          fi
