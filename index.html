<style>
/* Layout: one-screen phone app — sticky header (title, search, series chips), scrolling day-grouped game list */
:root{
  --bg:#eef1ef;--card:#ffffff;--fg:#161a18;--muted:#5b6560;--line:#d9dfdb;--field:#ffffff;
  --accent:#c8281c;--star:#d99a0b;--live:#c72e2e;
  --nascar:#c9361f;--f1:#1d5fb8;--nfl:#1f6f4a;--ncaa:#8a5a12;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615;--card:#1b201e;--fg:#e9eeeb;--muted:#99a39e;--line:#2b322f;--field:#232927;
  --accent:#ff6a55;--star:#f2c14e;--live:#ff6b6b;
  --nascar:#ff7a63;--f1:#78aef5;--nfl:#6fd09c;--ncaa:#e6b25f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615;--card:#1b201e;--fg:#e9eeeb;--muted:#99a39e;--line:#2b322f;--field:#232927;
  --accent:#ff6a55;--star:#f2c14e;--live:#ff6b6b;
  --nascar:#ff7a63;--f1:#78aef5;--nfl:#6fd09c;--ncaa:#e6b25f;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-inline:16px;padding-block:14px 16px;border-bottom:0}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-conic-gradient(var(--fg) 0 25%,var(--bg) 0 50%) 0 0/16px 16px;opacity:.85}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
h1{font-style:italic;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;font-size:1.6rem}
.count{white-space:nowrap}
.share{flex:none;font:700 .8rem var(--body);border:1.5px solid var(--accent);color:var(--accent);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;margin-left:auto}
.share:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:1.9rem;line-height:1;margin:0;letter-spacing:.01em}
.count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.upd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;font-size:.8rem;color:var(--muted)}
.refresh{flex:none;font:700 .85rem var(--body);border:1.5px solid var(--accent);color:var(--accent);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer}
.refresh:disabled{opacity:.55;cursor:default}
.refresh:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{margin:8px 0 0;font-size:.85rem;line-height:1.4;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.status.err{border-color:var(--live)}
.search{position:relative;margin-top:12px}
.search input{width:100%;box-sizing:border-box;font:500 1.05rem var(--body);padding:13px 44px 13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--fg)}
.search input:focus{outline:none;border-color:var(--accent)}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:1.4rem;width:36px;height:36px;border-radius:50%;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 .8rem var(--body);letter-spacing:.05em;text-transform:uppercase;border:1.5px solid var(--line);background:var(--card);color:var(--fg);padding:8px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,.star:focus-visible,.clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-inline:16px;padding-block:6px 40px}
.day h2{font-family:var(--display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.07em;margin:18px 0 8px;color:var(--muted)}
.day h2 b{color:var(--fg)}
.list{display:grid;gap:8px}
.game{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px 12px 0;overflow:hidden}
.bar{align-self:stretch;border-radius:0 3px 3px 0;margin:-12px 0}
.bar.nascar{background:var(--nascar)}.bar.f1{background:var(--f1)}.bar.nfl{background:var(--nfl)}.bar.ncaa{background:var(--ncaa)}
.info{min-width:0}
.meta{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .t{font-weight:700;color:var(--fg);font-size:.9rem}
.lg{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.7rem}
.lg.nascar{color:var(--nascar)}.lg.f1{color:var(--f1)}.lg.nfl{color:var(--nfl)}.lg.ncaa{color:var(--ncaa)}
.live{background:var(--live);color:#fff;font-weight:700;font-size:.66rem;letter-spacing:.08em;padding:2px 6px;border-radius:4px}
.ev{font-weight:700;font-size:1.05rem;margin-top:2px;overflow-wrap:anywhere}
.ev mark{background:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.note{font-size:.82rem;color:var(--muted);margin-top:1px}
.net{display:inline-block;margin-top:6px;font-weight:600;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.star{border:0;background:none;font-size:1.5rem;line-height:1;width:44px;height:44px;border-radius:50%;cursor:pointer;color:var(--line)}
.star[aria-pressed="true"]{color:var(--star)}
.tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tb{border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:.82rem;font-weight:600;border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
.tb[aria-pressed="true"]{border-color:var(--star);background:color-mix(in srgb,var(--star) 18%,transparent)}
.tb::before{content:"☆ "}.tb[aria-pressed="true"]::before{content:"★ ";color:var(--star)}
.tb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty b{display:block;color:var(--fg);font-size:1.1rem;margin-bottom:6px}
.foot{color:var(--muted);font-size:.8rem;margin-top:28px;line-height:1.5}
.pastbtn{display:block;margin:14px auto 0;font:600 .85rem var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;cursor:pointer}
</style>
</head><body>

    <div class="chips" role="group" aria-label="Filter">

      <button class="chip" id="c-nascar" data-f="nascar" aria-pressed="false">NASCAR</button>
      <button class="chip" id="c-f1" data-f="f1" aria-pressed="false">F1</button>
    </div>
  </header>
  <main>
    <div id="list"></div>
    <button class="pastbtn" id="past"></button>
    <p class="foot">All times Eastern. Sunday afternoon CBS and FOX games vary by area. College games for Oct 15–17 and Oct 22–24 aren't scheduled yet. Tap a team name under a game to save just that team to My teams. Records and rankings: <span id="asof"></span>.</p>
  </main>
</div>

const R_ASOF="NFL records after Week 3, AP poll of Sep 27, 2026";
const TRIGGER="trig_01R79o6YTtr6TwwWDK3aiVg8";
const LEAGUE={nfl:"NFL",ncaa:"College",nascar:"NASCAR",f1:"F1"};
// NFL nickname -> city, so "Cleveland" finds the Browns
const CITY={"Bears":"Chicago","Bengals":"Cincinnati","Bills":"Buffalo","Broncos":"Denver","Browns":"Cleveland","Buccaneers":"Tampa Bay Bucs","Cardinals":"Arizona","Chargers":"Los Angeles LA","Chiefs":"Kansas City KC","Colts":"Indianapolis Indy","Commanders":"Washington","Cowboys":"Dallas","Dolphins":"Miami","Eagles":"Philadelphia Philly","Falcons":"Atlanta","49ers":"San Francisco Niners SF","Giants":"New York NY","Jaguars":"Jacksonville Jags","Jets":"New York NY","Lions":"Detroit","Packers":"Green Bay","Panthers":"Carolina","Patriots":"New England Pats","Raiders":"Las Vegas","Rams":"Los Angeles LA","Ravens":"Baltimore","Saints":"New Orleans","Seahawks":"Seattle","Steelers":"Pittsburgh","Texans":"Houston","Titans":"Tennessee","Vikings":"Minnesota"};
const games=G.map(([iso,dur,lg,ev,note,net],i)=>{
  const start=new Date(iso),end=new Date(start.getTime()+dur*60000);
  const teams=ev.replace(/\(.*?\)/g,"").split(/\s+(?:at|vs\.)\s+/).map(s=>s.trim());
  const extra=lg==="nfl"?teams.map(t=>CITY[t]||"").join(" "):"";
  return {i,iso,start,end,lg,ev,note,net,teams:lg==="nfl"||lg==="ncaa"?teams:[ev],
    hay:(ev+" "+note+" "+net+" "+extra+" "+LEAGUE[lg]).toLowerCase()};
});
let filter="all",showPast=false,mine=new Set();
try{mine=new Set(JSON.parse(localStorage.getItem("myteams")||"[]"))}catch(e){}
try{filter=localStorage.getItem("filter")||"all"}catch(e){}
const saveMine=()=>{try{localStorage.setItem("myteams",JSON.stringify([...mine]))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fmtT=d=>d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/New_York"});
const dayKey=d=>d.toLocaleDateString("en-CA",{timeZone:"America/New_York"});
const dayLbl=d=>{
  const k=dayKey(d),today=dayKey(new Date()),tm=dayKey(new Date(Date.now()+864e5));
  const long=d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric",timeZone:"America/New_York"});
  return k===today?`<b>Today</b> · ${long}`:k===tm?`<b>Tomorrow</b> · ${long}`:`<b>${long.split(",")[0]}</b> · ${long.split(", ")[1]}`;
};
const isMine=g=>g.teams.some(t=>mine.has(t));
function hl(text,q){
  if(!q)return esc(text);
  const i=text.toLowerCase().indexOf(q);
  return i<0?esc(text):esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function render(){
  const q=$("q").value.trim().toLowerCase(),now=new Date();
  $("clear").hidden=!q;
  let past=0;
  const words=q.split(/\s+/).filter(Boolean);
  const list=games.filter(g=>{
    if(filter==="mine"&&!isMine(g))return false;
    if(filter!=="all"&&filter!=="mine"&&g.lg!==filter)return false;
    if(words.length&&!words.every(w=>g.hay.includes(w)))return false;
    if(!showPast&&g.end<now){past++;return false}
    return true;
  });
  $("count").textContent=list.length+(list.length===1?" game":" games");
  $("past").hidden=!showPast&&past===0;
  $("past").textContent=showPast?"Hide finished games":`Show ${past} finished game${past===1?"":"s"}`;
  if(!list.length){
    $("list").innerHTML=filter==="mine"&&!mine.size
      ?`<div class="empty"><b>No teams saved yet</b>Tap a team name under any game to add it here.</div>`
      :`<div class="empty"><b>No games found</b>Try a team name like "Browns", a city like "Cleveland", or a channel like "ESPN".</div>`;
    return;
  }
  const days={};list.forEach(g=>(days[dayKey(g.start)]??=[]).push(g));
  $("list").innerHTML=Object.values(days).map(gs=>`<section class="day"><h2>${dayLbl(gs[0].start)}</h2><div class="list">${gs.map(g=>{
    const live=g.start<=now&&now<g.end,fav=isMine(g),multi=g.teams.length>1;
    return `<article class="game"><span class="bar ${g.lg}"></span><div class="info">
      <div class="meta"><span class="t">${fmtT(g.start)}</span><span class="lg ${g.lg}">${LEAGUE[g.lg]}</span>${live?'<span class="live">ON NOW</span>':""}</div>
      <div class="ev">${hl(g.ev,words.length===1?words[0]:"")}</div>
      ${g.note?`<div class="note">${esc(g.note)}</div>`:""}
      <span class="net">${esc(g.net)}</span>
      ${multi?`<div class="tm">${g.teams.map(t=>{const r=(R[g.lg]||{})[t],lbl=(r&&r[1]?"#"+r[1]+" ":"")+t+(r&&r[0]?" "+r[0]:"");return `<button class="tb" data-t="${esc(t)}" aria-pressed="${mine.has(t)}" aria-label="${mine.has(t)?"Remove":"Save"} ${esc(t)}">${esc(lbl)}</button>`}).join("")}</div>`:""}</div>
      ${multi?"<span></span>":`<button class="star" data-i="${g.i}" aria-pressed="${fav}" aria-label="${fav?"Remove":"Save"} ${esc(g.teams[0])}">★</button>`}</article>`}).join("")}</div></section>`).join("");
}
$("list").addEventListener("click",e=>{
  const tb=e.target.closest(".tb");
  if(tb){const t=tb.dataset.t;mine.has(t)?mine.delete(t):mine.add(t);saveMine();render();return}
  const b=e.target.closest(".star");if(!b)return;
  const g=games[+b.dataset.i];
  if(isMine(g))g.teams.forEach(t=>mine.delete(t));else g.teams.forEach(t=>mine.add(t));
  saveMine();render();
});
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{

$("share").addEventListener("click",async()=>{
  const url=location.origin+location.pathname,b=$("share");
  try{if(navigator.share){await navigator.share({title:"Game Finder",text:"NFL, college football, NASCAR and F1 times and channels",url});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);b.textContent="Link copied";setTimeout(()=>b.textContent="Share",2000)}
  catch(e){window.prompt("Copy this link:",url)}
});

// Refresh: starts a background Claude run that looks up new games, then republishes this app (open copies reload by themselves)
$("asof").textContent=R_ASOF;
$("updated").textContent="Games updated "+UPDATED;
const RUN_MIN=20;
function status(msg,err){const s=$("status");s.hidden=!msg;s.textContent=msg||"";s.className="status"+(err?" err":"")}
function checkPending(){
  let t=0;try{t=+localStorage.getItem("refreshAt:"+UPDATED)||0}catch(e){}
  const left=RUN_MIN-(Date.now()-t)/60000;
  if(t&&left>0){$("refresh").disabled=true;$("refresh").textContent="↻ Updating…";
    status("Looking up new games now. This usually takes 10 to 20 minutes. The app reloads by itself when the new games are in.");return true}
  $("refresh").disabled=false;$("refresh").textContent="↻ Get new games";return false;
}
(async()=>{
  const mcp=await window.claude?.use?.("mcp").catch(()=>null);
  if(!mcp)return; // no refresh from this view; the list still works
  $("refresh").hidden=false;
  if(!checkPending())status("");
  $("refresh").addEventListener("click",async()=>{
    if(checkPending())return;
    const b=$("refresh");b.disabled=true;b.textContent="↻ Starting…";status("");
    try{
      await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:TRIGGER},{cache:false});
      try{localStorage.setItem("refreshAt:"+UPDATED,String(Date.now()))}catch(e){}
      checkPending();
    }catch(e){
      b.disabled=false;b.textContent="↻ Get new games";
      const c=e&&e.code;
      if(c==="not_in_manifest")status("Refresh isn't allowed for this page. Tap the button again and choose Allow when Claude asks.",true);
      else if(c==="needs_reauth")status("Your Claude Code Remote connection needs to be reconnected in claude.ai Settings → Connectors.",true);
      else if(c==="server_not_connected"||c==="selection_required")status("Refresh only works when you're signed in to Claude as the owner of this app.",true);
      else if(c==="tool_error")status("The update job couldn't start: "+(e.message||"unknown reason")+". Ask Claude in chat to refresh the games.",true);
      else if(c==="server_unavailable")status("Couldn't reach Claude just now. Wait a minute and tap again.",true);
      else status("Couldn't start the update. Wait a minute and tap again, or ask Claude in chat.",true);
    }
  });
  setInterval(checkPending,60000);
})();
</script>
